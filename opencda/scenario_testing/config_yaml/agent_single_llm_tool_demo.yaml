description: |-
  Single CAV demo for LLM Agent driven sensor-as-tools selection.
  The LLM Agent calls CameraTool, LiDARTool, RadarTool and FusionTool
  summaries using ego self-perceived sensor data only. CARLA server actor
  locations are not used as control inputs in the LLM behavior path.

carla_traffic_manager:
  vehicle_list:
    - spawn_position: [ -300, 8.3, 0.3, 0, 0, 0 ]
      vehicle_speed_perc: 20
    - spawn_position: [ -260, 4.8, 0.3, 0, 0, 0 ]
      vehicle_speed_perc: -50

scenario:
  max_steps: 1000

  single_cav_list:
    - name: cav1
      spawn_position: [ -370, 8.3, 0.3, 0, 0, 0 ]
      destination: [ 700, 8.3, 0.3 ]

      sensing:
        perception:
          # Keep activate false to avoid mandatory ML model loading.
          # Camera/LiDAR sensors are still spawned by visualize settings below.
          activate: false
          camera:
            visualize: 1
            num: 1
            positions:
              - [2.5, 0, 1.0, 0]
          lidar:
            visualize: true
            range: 80
            channels: 32
            points_per_second: 100000
            rotation_frequency: 20
            upper_fov: 10.0
            lower_fov: -30.0
            dropoff_general_rate: 0.0
            dropoff_intensity_limit: 1.0
            dropoff_zero_intensity: 0.0
            noise_stddev: 0.0

      behavior:
        use_llm_tool_agent: true
        # Do not pass CARLA-server object lists to the customized behavior path.
        # The LLM agent must use ego camera / LiDAR / radar tool outputs only.
        self_perception_only: true
        local_planner:
          debug_trajectory: true
          debug: true

        llm_sensor_agent:
          enabled: true
          debug: true
          llm_call_interval: 20
          initial_tools: [camera_tool, lidar_tool, radar_tool]

          risk_threshold:
            medium_distance: 60.0
            high_distance: 30.0
            critical_distance: 12.0

          tool_cost:
            ego_state_tool: 0.1
            camera_tool: 1.0
            lidar_tool: 2.0
            radar_tool: 1.5
            fusion_tool: 3.0

          lidar_tool:
            enabled: true
            # Auto checks +x and -x because raw LiDAR frame orientation may vary.
            axis_mode: auto
            # Ignore near-field ego-body / road-side clutter that appears around 5-6 m.
            front_x_min: 12.0
            front_x_max: 80.0
            lane_y_abs: 2.5
            z_min: -1.2
            z_max: 2.0
            min_points: 5
            x_bin_size: 4.0
            min_points_per_bin: 5
            distance_percentile: 40.0

          radar_tool:
            enabled: true
            range: 80.0
            horizontal_fov: 24.0
            vertical_fov: 8.0
            points_per_second: 1500
            position: [2.5, 0.0, 1.0, 0.0]
            # Ignore very near radar returns because they are often road/ego-body clutter.
            front_x_min: 15.0
            front_x_max: 80.0
            lane_y_abs: 1.8
            z_abs: 2.5
            min_points: 3
            depth_bin_size: 4.0
            min_points_per_bin: 3
            max_abs_velocity: 80.0
            min_confidence: 0.35
            ttc_max: 99.0

          camera_tool:
            enabled: true
            # ROI is normalized: [x1, y1, x2, y2]. It covers the lower-center
            # front region of the RGB image.
            front_roi: [0.30, 0.45, 0.70, 0.85]
            edge_threshold: 35.0
            edge_density_threshold: 0.035
            dark_ratio_threshold: 0.08
            dark_pixel_threshold: 80.0

          fusion_tool:
            enabled: true
            max_lidar_radar_distance_gap: 8.0

      v2x:
        communication_range: 45
