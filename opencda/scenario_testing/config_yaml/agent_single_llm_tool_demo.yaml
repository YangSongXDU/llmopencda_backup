description: |-
  Single CAV demo for LLM Agent driven sensor-as-tools selection and a first
  overtaking prototype. Camera/LiDAR/Radar remain ego-sensor tools. The
  front_vehicle_debug_tool and lane_check_tool use CARLA actors/map for
  debugging and first maneuver validation; disable them for strict
  self-perception-only experiments.

carla_traffic_manager:
  vehicle_list:
    # Slow front vehicle in the ego lane. It is intentionally closer than before
    # so that the overtaking maneuver can be observed clearly.
    - spawn_position: [ -330, 8.3, 0.3, 0, 0, 0 ]
      vehicle_speed_perc: 60
    # Adjacent-lane traffic farther ahead, leaving enough gap for an initial
    # lane-change/overtake decision.
    - spawn_position: [ -250, 4.8, 0.3, 0, 0, 0 ]
      vehicle_speed_perc: -20

scenario:
  max_steps: 1000

  single_cav_list:
    - name: cav1
      spawn_position: [ -370, 8.3, 0.3, 0, 0, 0 ]
      destination: [ 700, 8.3, 0.3 ]

      sensing:
        perception:
          # Keep activate false to avoid mandatory ML model loading.
          # Camera/LiDAR sensors are still spawned by visualize settings below.
          activate: false
          camera:
            visualize: 1
            num: 1
            positions:
              - [2.5, 0, 1.0, 0]
          lidar:
            visualize: true
            range: 80
            channels: 32
            points_per_second: 100000
            rotation_frequency: 20
            upper_fov: 10.0
            lower_fov: -30.0
            dropoff_general_rate: 0.0
            dropoff_intensity_limit: 1.0
            dropoff_zero_intensity: 0.0
            noise_stddev: 0.0

      behavior:
        use_llm_tool_agent: true
        self_perception_only: true
        local_planner:
          debug_trajectory: true
          debug: true

        llm_overtake:
          enabled: true
          lookahead_distance: 45.0
          return_lookahead_distance: 45.0
          pass_distance_margin: 12.0
          min_passing_distance: 65.0
          cooldown_steps: 80

        llm_sensor_agent:
          enabled: true
          debug: true
          # More responsive than the earlier 20-frame interval so lane-change
          # decisions can be updated quickly.
          llm_call_interval: 5
          # For the first overtaking prototype, debug front/lane tools are
          # enabled. They make the front-car distance visible in logs/CSV and
          # allow a robust overtake_left/right decision.
          initial_tools: [camera_tool, lidar_tool, radar_tool, front_vehicle_debug_tool, lane_check_tool]

          # llm_provider: local uses deterministic heuristic logic.
          # To call a real DeepSeek-compatible LLM, set llm_provider: deepseek
          # and export DEEPSEEK_API_KEY in your shell before running.
          llm_provider: local
          llm_model: deepseek-chat
          llm_base_url: https://api.deepseek.com/chat/completions
          api_key_env: DEEPSEEK_API_KEY
          temperature: 0.0

          risk_threshold:
            medium_distance: 60.0
            high_distance: 30.0
            critical_distance: 12.0

          tool_cost:
            ego_state_tool: 0.1
            camera_tool: 1.0
            lidar_tool: 2.0
            radar_tool: 1.5
            front_vehicle_debug_tool: 0.2
            lane_check_tool: 0.5
            fusion_tool: 3.0

          front_vehicle_debug_tool:
            enabled: true
            max_distance: 120.0
            lane_y_abs: 2.5
            same_lane_only: true

          lane_check_tool:
            enabled: true
            safe_front_distance: 25.0
            safe_rear_distance: 12.0
            check_distance: 60.0

          lidar_tool:
            enabled: true
            axis_mode: auto
            front_x_min: 12.0
            front_x_max: 80.0
            lane_y_abs: 2.5
            z_min: -1.2
            z_max: 2.0
            min_points: 5
            x_bin_size: 4.0
            min_points_per_bin: 5
            distance_percentile: 40.0

          radar_tool:
            enabled: true
            range: 80.0
            horizontal_fov: 24.0
            vertical_fov: 8.0
            points_per_second: 1500
            position: [2.5, 0.0, 1.0, 0.0]
            front_x_min: 15.0
            front_x_max: 80.0
            lane_y_abs: 1.8
            z_abs: 2.5
            min_points: 3
            depth_bin_size: 4.0
            min_points_per_bin: 3
            max_abs_velocity: 80.0
            min_confidence: 0.35
            ttc_max: 99.0

          camera_tool:
            enabled: true
            front_roi: [0.30, 0.45, 0.70, 0.85]
            edge_threshold: 35.0
            edge_density_threshold: 0.035
            dark_ratio_threshold: 0.08
            dark_pixel_threshold: 80.0

          fusion_tool:
            enabled: true
            max_lidar_radar_distance_gap: 8.0

      v2x:
        communication_range: 45
